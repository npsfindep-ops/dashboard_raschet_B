<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Окупаемость проекта курьерской доставки В</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#111111;
    --card-bg:#1e1e1e;
    --line:#2a2a2a;
    --line-strong:#333333;
    --text-hi:#ffffff;
    --text:#ffffff;
    --text-dim:#888888;
    --plan:#a3e635;
    --plan-soft:rgba(163,230,53,.15);
    --fact:#f97316;
    --fact-soft:rgba(249,115,22,.15);
    --danger:#ff4d4d;
    --danger-soft:rgba(255,77,77,.12);
    --good:#a3e635;
    --warn:#facc15;
    --radius:8px;
    --radius-sm:6px;
    --mono:'Geologica', sans-serif;
    --sans:'Geologica', sans-serif;
    /* per-metric accent palette (mirrors the reference dashboard's metric colour coding) */
    --m-profit:#38bdf8;
    --m-revenue:#a3e635;
    --m-expenses:#fb923c;
    --m-avgCheck:#a78bfa;
    --m-orders:#34d399;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;}

  /* ---------------- 16:9 scaled stage ---------------- */
  /* Fixed design canvas (1600x900 = 16:9). JS scales it uniformly to fit any viewport,
     so the whole dashboard always fits on one screen without scrolling, at any monitor size. */
  #stage{
    width:1600px; height:900px; flex:none;
    transform-origin: center center;
    background:var(--bg);
    padding:22px 28px;
    display:flex; flex-direction:column; gap:12px;
  }
  ::-webkit-scrollbar{height:7px; width:7px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:4px;}

  /* ---------------- header ---------------- */
  header{
    display:flex; justify-content:space-between; align-items:baseline; gap:20px; flex:none;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  h1{font-size:17px; font-weight:700; margin:0; letter-spacing:-.01em; color:var(--text-hi); line-height:1.2;}
  .meta{font-family:var(--sans); font-size:12px; font-weight:400; color:#777777;}
  .meta b{color:#777777; font-weight:400;}

  #status-banner{
    display:none; flex:none; padding:10px 15px; border-radius:9px;
    background:var(--danger-soft); border:1px solid rgba(255,93,120,.35);
    color:#ffd7de; font-size:12.5px; line-height:1.5;
  }

  /* ---------------- metric toggle (pill buttons, centered — matches reference filter bar) ---------------- */
  .metric-toggle{display:flex; gap:8px; flex:none; justify-content:center; align-items:center;}
  .metric-toggle button{
    font-family:var(--sans); font-size:13px; font-weight:600; color:var(--text-hi);
    background:#252525; border:1px solid #333333; border-radius:20px; padding:5px 18px; cursor:pointer;
    transition:all .15s ease;
  }
  .metric-toggle button.active{background:var(--m-accent, var(--plan)); border-color:var(--m-accent, var(--plan)); color:#000;}
  .metric-toggle button:hover:not(.active){background:#333333;}

  /* ---------------- split rows (fill remaining vertical space, equal 1:1 like reference) ---------------- */
  .split-21{display:grid; grid-template-columns:2fr 1fr; gap:12px; min-height:0; width:100%;}
  .row-top{flex:1 1 0; min-height:0;}
  .row-bottom{flex:1 1 0; min-height:0;}

  /* ---------------- insights ---------------- */
  .insights-panel{
    background:var(--card-bg);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px;
    display:flex; flex-direction:column; gap:9px; min-height:0; min-width:0; overflow-y:auto;
  }
  .insights-panel h4{margin:0 0 1px; font-size:10px; font-weight:600; color:rgba(255,255,255,.8); text-transform:uppercase; letter-spacing:.06em; flex:none;}
  .insight{
    background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px;
    display:flex; gap:9px; align-items:flex-start; flex:none;
  }
  .insight .ic{
    flex:none; width:24px; height:24px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--tone-soft, var(--fact-soft)); color:var(--tone, var(--fact));
  }
  .insight .ic svg{width:13px; height:13px;}
  .insight .body{font-size:12px; line-height:1.45; color:var(--text);}
  .insight .body b{color:var(--text-hi); font-weight:700;}
  .insight.tone-good{--tone:var(--good); --tone-soft:var(--plan-soft);}
  .insight.tone-bad{--tone:var(--danger); --tone-soft:var(--danger-soft);}
  .insight.tone-warn{--tone:var(--warn); --tone-soft:rgba(255,200,87,.14);}
  .insight.tone-neutral{--tone:#aab4d1; --tone-soft:rgba(154,165,196,.14);}

  /* ---------------- KPI cards — always one row of 7 ---------------- */
  .kpis{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; flex:none;}
  .kpi{
    position:relative;
    background:var(--card-bg);
    border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px;
    display:flex; flex-direction:column;
  }
  .kpi .label{font-size:10px; color:rgba(255,255,255,.8); font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:16px;}
  .kpi .value{font-size:24px; font-weight:700; letter-spacing:-.02em; color:#ffffff; line-height:1; margin-bottom:5px;}
  .kpi .indicators{display:flex; flex-direction:column; gap:3px;}
  .ind-row{display:flex; justify-content:space-between; align-items:center; font-size:12px;}
  .ind-row .ind-label{color:#888888; font-weight:400;}
  .ind-row .ind-value{font-weight:600;}
  .ind-row .ind-value.good{color:#a3e635;}
  .ind-row .ind-value.bad{color:#ff4d4d;}
  .ind-row .ind-value.neutral{color:var(--text);}
  .kpi-info{
    position:absolute; top:9px; right:9px; width:15px; height:15px; border-radius:50%;
    background:rgba(255,255,255,.14); color:#ffffff; font-size:9.5px; font-family:var(--sans); font-weight:700;
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; padding:0;
  }
  .kpi-info:hover{background:rgba(255,255,255,.26);}
  #kpi-tooltip{
    position:fixed; z-index:80; max-width:230px; background:#1e1e1e; border:1px solid #333333;
    border-radius:8px; padding:10px 12px; font-size:11.5px; color:#ffffff; line-height:1.5;
    display:none; box-shadow:0 10px 28px rgba(0,0,0,.45);
  }

  /* ---------------- chart cards ---------------- */
  .chart-card{
    background:var(--card-bg);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px 10px;
    display:flex; flex-direction:column; min-height:0; min-width:0;
  }
  .chart-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex:none;}
  .chart-head h3{margin:0; font-size:10px; font-weight:600; color:rgba(255,255,255,.8); text-transform:uppercase; letter-spacing:.06em;}
  .chart-head p{margin:3px 0 0; font-size:11px; color:#ffffff; text-transform:none; letter-spacing:0;}
  .legend-inline{display:flex; gap:11px; font-family:var(--mono); font-size:10.5px; color:#ffffff; flex:none;}
  .legend-inline .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle;}
  .legend-inline .sw.dash{background:none; border-top:2px dashed #ffffff; width:10px; height:0; margin-top:3px;}
  .chart-wrap{position:relative; flex:1; min-height:0; margin-top:6px;}

  /* ---------------- table ---------------- */
  .table-card{
    background:var(--card-bg);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    display:flex; flex-direction:column; min-height:0; min-width:0;
  }
  .table-card h3{margin:0 0 8px; font-size:10px; font-weight:600; color:rgba(255,255,255,.8); text-transform:uppercase; letter-spacing:.06em; flex:none;}
  .table-head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex:none;}
  #detail-table-period{font-size:10.5px; color:#888888; margin-left:8px;}
  .expand-btn{
    font-family:var(--sans); font-size:11.5px; font-weight:600; color:rgba(255,255,255,.8);
    background:#252525; border:1px solid #333333; border-radius:7px; padding:5px 12px; cursor:pointer;
  }
  .expand-btn:hover{background:#333333;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:300; display:none; align-items:center; justify-content:center; padding:30px;}
  .modal-overlay.open{display:flex;}
  .modal-panel{background:#1e1e1e; border:1px solid #333333; border-radius:12px; padding:18px 22px 22px; width:min(1000px,94vw); max-height:88vh; display:flex; flex-direction:column;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex:none; gap:14px;}
  .modal-head h3{flex:1;}
  .modal-type-toggle{display:flex; gap:6px; flex:none;}
  .modal-type-toggle button{
    font-family:var(--sans); font-size:11.5px; font-weight:600; color:#ffffff;
    background:#252525; border:1px solid #333333; border-radius:16px; padding:4px 12px; cursor:pointer;
  }
  .modal-type-toggle button.active{background:#a3e635; color:#0a0e17; border-color:transparent;}
  .modal-type-toggle button:hover:not(.active){background:#333333;}
  .modal-head h3{margin:0; font-size:13px; font-weight:400; color:#ffffff; text-transform:uppercase; letter-spacing:.05em;}
  #modal-close{background:none; border:none; color:#888888; font-size:22px; cursor:pointer; line-height:1; padding:0 4px;}
  #modal-close:hover{color:#ffffff;}
  .modal-body{overflow:auto;}
  #expense-modal-table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12px;}
  #expense-modal-table th{position:sticky; top:0; background:#1e1e1e; text-align:right; font-weight:400; color:#ffffff; font-size:10.5px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid #333333;}
  #expense-modal-table th:first-child{text-align:left;}
  #expense-modal-table td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:400; color:#ffffff;}
  #expense-modal-table td:first-child{text-align:left; font-family:var(--sans); font-weight:400; color:#ffffff;}
  #expense-modal-table tr.modal-total td{font-weight:400; border-top:1px solid #333333; border-bottom:none;}
  .table-scroll{overflow-y:auto; overflow-x:hidden; min-height:0; flex:1;}
  table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11.5px;}
  thead th{
    text-align:right; font-weight:400; color:#ffffff; font-size:9.5px;
    text-transform:uppercase; letter-spacing:.02em; padding:6px 10px; border-bottom:1px solid var(--line-strong);
    position:sticky; top:0; background:var(--card-bg);
  }
  thead th:first-child{text-align:left;}
  tbody td{padding:5px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-weight:400;}
  tbody td:first-child{text-align:left; font-family:var(--sans); font-weight:400; color:var(--text);}
  tbody tr:hover{background:rgba(255,255,255,.025);}
  tbody tr.row-current{background:rgba(249,115,22,.14); box-shadow:inset 3px 0 0 #f97316;}
  tbody tr.row-current:hover{background:rgba(249,115,22,.2);}
  .cell-pct{border-radius:5px; padding:1px 7px; font-weight:700;}
  .delta-pos{color:var(--good);} .delta-neg{color:var(--danger);}
  .delta-arrow{width:9px; height:9px; vertical-align:-1px; margin-left:4px;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
<div id="stage">

  <header>
    <h1>Окупаемость проекта курьерской доставки В</h1>
    <div class="meta">Обновлено: <b id="updated-at">—</b></div>
  </header>

  <div id="status-banner"></div>

  <section class="kpis" id="kpi-grid"></section>
  <div id="kpi-tooltip"></div>

  <div class="metric-toggle" id="metric-toggle">
    <button data-m="profit" class="active">Прибыль</button>
    <button data-m="revenue">Выручка</button>
    <button data-m="expenses">Расходы</button>
    <button data-m="avgCheck">Средний чек</button>
    <button data-m="orders">Заказы</button>
    <button data-m="bdr">БДР</button>
  </div>

  <div class="split-21 row-top">
    <div class="chart-card">
      <div class="chart-head">
        <div><h3 id="metric-chart-title">Прибыль</h3><p id="metric-chart-sub"></p></div>
        <div class="legend-inline">
          <span id="legend-plan-item"><span class="sw" id="sw-plan"></span><span id="legend-plan-text">План</span></span>
          <span id="legend-fact-item"><span class="sw" id="sw-fact"></span><span id="legend-fact-text">Факт</span></span>
          <span id="legend-forecast-item"><span class="sw dash" id="sw-forecast"></span>Прогноз</span>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-metric"></canvas></div>
    </div>
    <div class="insights-panel" id="insights-panel"></div>
  </div>

  <div class="split-21 row-bottom">
    <div class="table-card">
      <div class="table-head-row">
        <div><h3 id="detail-table-title" style="display:inline">Прибыль по месяцам</h3><span id="detail-table-period"></span></div>
        <button id="expand-btn" class="expand-btn" type="button" style="display:none">Развернуть</button>
      </div>
      <div class="table-scroll"><table><thead id="detail-thead"></thead><tbody id="detail-tbody"></tbody></table></div>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <div><h3 id="payoff-chart-title">Окупаемость</h3></div>
        <div class="legend-inline">
          <span><span class="sw" style="background:#a3e635"></span>План</span>
          <span><span class="sw" style="background:#f97316"></span>Факт</span>
          <span><span class="sw dash" style="border-top-color:#f97316"></span>Прогноз</span>
          <span><span class="sw" style="background:#facc15"></span>Вложения</span>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-payoff"></canvas></div>
    </div>
  </div>

</div>

<div id="expense-modal" class="modal-overlay">
  <div class="modal-panel">
    <div class="modal-head">
      <h3>Расходы по статьям — по месяцам, ₽</h3>
      <div class="modal-type-toggle" id="modal-type-toggle">
        <button data-type="Факт" class="active" type="button">Факт</button>
        <button data-type="План" type="button">План</button>
      </div>
      <button id="modal-close" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body"><table id="expense-modal-table"><thead></thead><tbody></tbody></table></div>
  </div>
</div>

<script>
const SHEET_ID = "1XLsirVOVZWja5InJHN_3cha7KdlH-Wi1_NPQphGyrKE";
const SHEET_NAME = "Свод план-факт";
const RU_MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

const ICONS = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l6-6 4 4 6-8"/><path d="M14 6h6v6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l6 6 4-4 6 8"/><path d="M14 18h6v-6"/></svg>',
  target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".7" fill="currentColor"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>',
  arrowUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  arrowDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
};

const METRICS = {
  profit:    { label:'Прибыль',      field:'netProfit', money:true,  sub:'' },
  revenue:   { label:'Выручка',      field:'revenue',    money:true,  sub:'' },
  expenses:  { label:'Расходы',      field:'expenses',   money:true,  sub:'' },
  avgCheck:  { label:'Средний чек',  field:'avgCheck',   money:true,  sub:'' },
  orders:    { label:'Заказы',       field:'orders',     money:false, sub:'' },
  bdr:       { label:'БДР',          field:'netProfit',  money:true,  sub:'' },
};

const FIELD_MAP = {
  date:'Дата', type:'Тип', orders:'Кол-во заказов, шт', avgCheck:'Ср чек (с НДС), руб',
  revenue:'Выручка (с НДС), руб',
  partnerPrice:'Партнерский прайс, руб.', royalty:'Роялти, руб.',
  salary:'ЗП с ФОТ менеджера сервиса', salaryTax:'Зарплатные налоги', bonus:'Премии с продаж/прибыли',
  loanInterest:'Проценты по займу, руб.', vatOut:'НДС исходящий, руб.', vatIn:'НДС вход, руб.',
  expenses:'Расходы, руб', profitBeforeTax:'Прибыль до налогообложения, руб', incomeTax:'Налог на прибыль',
  netProfit:'Чистая прибыль, руб.',
  cumProfit:'Прибыль накопительно, руб', periodNo:'Номер периода (мес.)',
  loanStart:'Займ на начало периода', loanRepay:'Гашение займа', loanEnd:'Займ на конец периода',
  investment:'Сумма вложений',
  cacAmort:'Отражение затрат на покупку клиента в БДР', cacVat:'НДС входящий с покупки клиента',
  finResultPeriod:'Фин. рез. по проекту в БДР (за период)', finResultCum:'Фин. рез. по проекту нарастающим итогом',
};

function parseGvizDate(v){
  if (v == null) return null;
  if (typeof v === 'string' && v.indexOf('Date(') === 0){
    const m = v.match(/Date\((\d+),(\d+),(\d+)/);
    if (m) return new Date(+m[1], +m[2], +m[3]);
  }
  return null;
}
function findColIndex(cols, name){
  let idx = cols.findIndex(c => (c.label||'').trim() === name);
  if (idx !== -1) return idx;
  idx = cols.findIndex(c => (c.label||'').trim().toLowerCase().includes(name.toLowerCase()));
  return idx;
}
function extractRowsFromGviz(json){
  const cols = json.table.cols;
  const colIdx = {};
  for (const key in FIELD_MAP) colIdx[key] = findColIndex(cols, FIELD_MAP[key]);
  const rows = [];
  for (const r of json.table.rows){
    const c = r.c;
    const get = (key) => { const i = colIdx[key]; if (i==null||i<0||!c[i]) return null; return c[i].v; };
    const date = parseGvizDate(get('date'));
    const type = get('type');
    const revenue = get('revenue');
    if (!date || !type || revenue == null) continue;
    const orders = get('orders');
    const avgCheck = orders ? revenue/orders : get('avgCheck');
    rows.push({
      date, type, orders, avgCheck, revenue,
      partnerPrice:get('partnerPrice'), royalty:get('royalty'), salary:get('salary'),
      salaryTax:get('salaryTax'), bonus:get('bonus'), loanInterest:get('loanInterest'),
      vatOut:get('vatOut'), vatIn:get('vatIn'),
      expenses:get('expenses'), profitBeforeTax:get('profitBeforeTax'), incomeTax:get('incomeTax'),
      netProfit:get('netProfit'), cumProfit:get('cumProfit'),
      loanStart:get('loanStart'), loanRepay:get('loanRepay'), loanEnd:get('loanEnd'), periodNo:get('periodNo'),
      investment:get('investment'),
      cacAmort:get('cacAmort'), cacVat:get('cacVat'),
      finResultPeriod:get('finResultPeriod'), finResultCum:get('finResultCum'),
    });
  }
  rows.sort((a,b) => a.date - b.date || (a.type==='План'?1:-1));
  return rows;
}

function loadGvizJSONP(timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = 'gvizCB_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    let done = false;
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?`
      + `tqx=${encodeURIComponent('out:json;responseHandler:' + cbName)}`
      + `&sheet=${encodeURIComponent(SHEET_NAME)}&headers=1&_=${Date.now()}`;
    const script = document.createElement('script');
    function cleanup(){ clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    const timer = setTimeout(() => { if (done) return; done = true; cleanup();
      reject(new Error('Таймаут запроса — нет ответа от Google за ' + (timeoutMs/1000) + ' сек.')); }, timeoutMs || 12000);
    window[cbName] = function(json){ if (done) return; done = true; cleanup(); resolve(json); };
    script.onerror = () => { if (done) return; done = true; cleanup();
      reject(new Error('Не удалось загрузить скрипт с docs.google.com — проверьте доступ к таблице и интернет.')); };
    script.src = url;
    document.head.appendChild(script);
  });
}

function fmtDate(d){ return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
function fmtMon(d){ return `${RU_MONTHS[d.getMonth()]}.${String(d.getFullYear()).slice(2)}`; }
function fmtRub(n, compact){
  if (n == null || isNaN(n)) return "—";
  if (compact){
    const abs = Math.abs(n);
    if (abs >= 1000000) return (n/1000000).toLocaleString('ru-RU',{maximumFractionDigits:2}) + " млн ₽";
    if (abs >= 1000) return (n/1000).toLocaleString('ru-RU',{maximumFractionDigits:0}) + " тыс ₽";
  }
  return Math.round(n).toLocaleString('ru-RU') + " ₽";
}
function fmtRubPlain(n){ return n==null||isNaN(n) ? "—" : Math.round(n).toLocaleString('ru-RU'); }
function fmtNum(n, digits){ return n==null||isNaN(n) ? "—" : n.toLocaleString('ru-RU', {maximumFractionDigits: digits||0}); }
function fmtPct(n, digits){ return n==null||isNaN(n) ? "—" : (n>=0?'+':'') + n.toFixed(digits==null?0:digits) + '%'; }
function fmtPP(n){ return n==null||isNaN(n) ? "—" : (n>=0?'+':'') + n.toFixed(1) + ' п.п.'; }
function addMonths(d,n){ const m=d.getMonth()+n; const y=d.getFullYear()+Math.floor(m/12); return new Date(y, ((m%12)+12)%12, 1); }
function monthsBetween(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()); }

function render(){

// ==================== break-even engine ====================
function computeBreakEven(planRows, factRows, lastFact, projections){
  const invRow = factRows.find(r => r.investment != null) || planRows.find(r => r.investment != null);
  const investment = invRow ? invRow.investment : (planRows[0] ? planRows[0].loanStart : null);

  const planBE = investment!=null ? (planRows.find(r => (r.cumProfit||0) >= investment) || null) : null;
  let factBE = investment!=null ? (factRows.find(r => (r.cumProfit||0) >= investment) || null) : null;
  let factBEIsProjection = false;
  let projFailed = false;
  let requiredMonthlyProfit = null, actualRecentMonthlyProfit = null;

  if (investment!=null && lastFact){
    const sample = factRows.slice(-3);
    actualRecentMonthlyProfit = sample.reduce((s,r)=>s+(r.netProfit||0),0) / sample.length;
    if (!factBE && projections){
      // integrate the SAME orders×check→revenue→margin→profit projection used on the charts,
      // so the KPI and the payoff chart can never disagree with each other.
      const profitDashed = projections.profit.dashed;
      let cum = lastFact.cumProfit;
      let foundDate = null;
      const idx = {}; planRows.forEach((r,i)=>idx[+r.date]=i);
      const lastFactIdx = idx[+lastFact.date];
      if (lastFactIdx != null){
        for (let i=lastFactIdx+1; i<planRows.length; i++){
          const projNet = profitDashed[i];
          cum += (projNet!=null ? projNet : 0);
          if (cum >= investment){ foundDate = planRows[i].date; break; }
        }
      }
      if (foundDate){
        factBE = { date: foundDate };
        factBEIsProjection = true;
      } else if (actualRecentMonthlyProfit <= 0){
        projFailed = true;
      }
    }
    if (planBE){
      const monthsToPlanDeadline = monthsBetween(lastFact.date, planBE.date);
      const remaining = investment - lastFact.cumProfit;
      if (monthsToPlanDeadline > 0 && remaining > 0) requiredMonthlyProfit = remaining / monthsToPlanDeadline;
    }
  }

  const delta = (planBE && factBE) ? monthsBetween(planBE.date, factBE.date) : null;
  const factMonths = (factBE && factRows.length) ? monthsBetween(factRows[0].date, factBE.date) + 1 : null;
  const planMonths = (planBE && planRows.length) ? monthsBetween(planRows[0].date, planBE.date) + 1 : null;

  return { investment, planBE, factBE, factBEIsProjection, projFailed, delta, requiredMonthlyProfit, actualRecentMonthlyProfit, factMonths, planMonths };
}

function fmtThousand(n){
  if (n==null || isNaN(n)) return '—';
  return (n/1000).toLocaleString('ru-RU', {maximumFractionDigits:1});
}
function fmtAdaptive(n){
  if (n==null || isNaN(n)) return { value:'—', unit:'тыс ₽' };
  const abs = Math.abs(n);
  if (abs >= 1000000) return { value: (n/1000000).toLocaleString('ru-RU',{maximumFractionDigits:2}), unit:'млн ₽' };
  return { value: (n/1000).toLocaleString('ru-RU',{maximumFractionDigits:1}), unit:'тыс ₽' };
}

function renderKPIs(planRows, factRows, lastFact, planByDate, be){
  const grid = document.getElementById('kpi-grid');
  if (!lastFact){ grid.innerHTML = `<div class="kpi"><div class="label">Нет фактических данных</div><div class="value">—</div></div>`; return; }

  const cards = [];
  const prevFact = factRows.length>=2 ? factRows[factRows.length-2] : null;

  // 1) Окупаемость, %
  if (be.investment){
    const factPct = lastFact.cumProfit/be.investment*100;
    const planAtCutoff = planByDate[+lastFact.date];
    const planPct = planAtCutoff ? planAtCutoff.cumProfit/be.investment*100 : null;
    const stillNeeded = Math.max(0, be.investment - lastFact.cumProfit);
    const stillNeededF = fmtAdaptive(stillNeeded);
    cards.push({ label:'ОКУПАЕМОСТЬ, %', value: factPct.toFixed(0), rows:[
      { label:'к плану', value: planPct!=null?fmtPP(factPct-planPct):'—', tone: planPct!=null?(factPct>=planPct?'good':'bad'):'neutral' },
      { label:`ещё нужно, ${stillNeededF.unit}`, value: stillNeededF.value, tone:'neutral' },
    ]});
  }

  // 2) Срок окупаемости, мес.
  {
    const factVal = be.factMonths!=null ? String(be.factMonths) : (be.projFailed?'—':'…');
    const remaining = be.factBE ? monthsBetween(lastFact.date, be.factBE.date) : null;
    const payoffMonthTxt = be.factBE ? fmtMon(be.factBE.date) : null;
    const deltaTxt = be.delta!=null ? (be.delta===0?'0':(be.delta>0?`+${be.delta}`:`−${Math.abs(be.delta)}`)) : null;
    cards.push({ label:'СРОК ОКУПАЕМОСТИ, МЕС.', value: factVal, rows:[
      { label:'к плану', value: (deltaTxt && be.planBE) ? `${deltaTxt} (${fmtMon(be.planBE.date)})` : '—',
        tone: be.delta!=null ? (be.delta<=0?'good':'bad') : 'neutral' },
      { label:'осталось', value: remaining!=null ? `${remaining} (${payoffMonthTxt})` : '—', tone:'neutral' },
    ]});
  }

  // 3) Заём
  {
    const planAtCutoff = planByDate[+lastFact.date];
    const loanF = fmtAdaptive(lastFact.loanEnd);
    const loanStart = planRows[0]?.loanStart;
    const repaidPct = (loanStart && lastFact.loanEnd!=null) ? (loanStart-lastFact.loanEnd)/loanStart*100 : null;
    const planRepaidPct = (loanStart && planAtCutoff && planAtCutoff.loanEnd!=null) ? (loanStart-planAtCutoff.loanEnd)/loanStart*100 : null;
    const repaidDeltaPP = (repaidPct!=null && planRepaidPct!=null) ? repaidPct-planRepaidPct : null;
    cards.push({ label:`ЗАЙМ, ${loanF.unit.toUpperCase()}`, value: loanF.value, rows:[
      { label:'к плану', value: repaidDeltaPP!=null?fmtPP(repaidDeltaPP):'—', tone: repaidDeltaPP!=null?(repaidDeltaPP>=0?'good':'bad'):'neutral' },
      { label:'погашено', value: repaidPct!=null?repaidPct.toFixed(0)+'%':'—', tone:'neutral' },
    ]});
  }

  // 4) Ср.выручка (среднемесячная)
  {
    const revFactCum = factRows.reduce((s,r)=>s+(r.revenue||0),0);
    const netFactCumRow4 = factRows.reduce((s,r)=>s+(r.netProfit||0),0);
    const planCumRows = planRows.filter(r=>r.date<=lastFact.date);
    const revPlanCum = planCumRows.reduce((s,r)=>s+(r.revenue||0),0);
    const avgRevFact = factRows.length ? revFactCum/factRows.length : null;
    const avgRevPlan = planCumRows.length ? revPlanCum/planCumRows.length : null;
    const pct = (avgRevFact!=null && avgRevPlan) ? (avgRevFact/avgRevPlan*100-100) : null;
    const currentMarginRow4 = revFactCum ? netFactCumRow4/revFactCum : null;
    const neededRevenue = (be.requiredMonthlyProfit!=null && currentMarginRow4>0) ? be.requiredMonthlyProfit/currentMarginRow4 : null;
    const neededRevF = fmtAdaptive(neededRevenue);
    const avgRevF = fmtAdaptive(avgRevFact);
    cards.push({ label:`СР.ВЫРУЧКА, ${avgRevF.unit.toUpperCase()}/МЕС.`, value: avgRevF.value,
      info:'Средняя выручка в месяц, при текущей рентабельности, нужная для выхода на окупаемость в плановый срок.', rows:[
      { label:'к плану', value: pct!=null?fmtPct(pct,0):'—', tone: pct!=null?(pct>=0?'good':'bad'):'neutral' },
      { label:'нужно для окуп.', value: neededRevenue!=null?`${neededRevF.value} ${neededRevF.unit}`:'—', tone: (neededRevenue!=null&&avgRevFact!=null)?(avgRevFact>=neededRevenue?'good':'bad'):'neutral' },
    ]});
  }

  // 5) Рентабельность, %
  {
    const revFactCum = factRows.reduce((s,r)=>s+(r.revenue||0),0);
    const netFactCum = factRows.reduce((s,r)=>s+(r.netProfit||0),0);
    const planCum = planRows.filter(r=>r.date<=lastFact.date);
    const revPlanCum = planCum.reduce((s,r)=>s+(r.revenue||0),0);
    const netPlanCum = planCum.reduce((s,r)=>s+(r.netProfit||0),0);
    const rFact = revFactCum ? netFactCum/revFactCum*100 : null;
    const rPlan = revPlanCum ? netPlanCum/revPlanCum*100 : null;
    const avgRevFactRow5 = factRows.length ? revFactCum/factRows.length : null;
    const neededMargin = (be.requiredMonthlyProfit!=null && avgRevFactRow5) ? be.requiredMonthlyProfit/avgRevFactRow5*100 : null;
    cards.push({ label:'РЕНТАБЕЛЬНОСТЬ, %', value: rFact!=null?rFact.toFixed(1):'—',
      info:'Минимальная рентабельность, при текущей выручке, необходимая для выхода на окупаемость в плановый срок.', rows:[
      { label:'к плану', value: (rFact!=null&&rPlan!=null)?fmtPP(rFact-rPlan):'—', tone: (rFact!=null&&rPlan!=null)?(rFact>=rPlan?'good':'bad'):'neutral' },
      { label:'мин. для окуп.', value: neededMargin!=null?neededMargin.toFixed(1)+'%':'—', tone: (neededMargin!=null&&rFact!=null)?(rFact>=neededMargin?'good':'bad'):'neutral' },
    ]});
  }

  // 6) Средний чек, ₽
  {
    const planAtCutoff = planByDate[+lastFact.date];
    const pct = planAtCutoff && planAtCutoff.avgCheck ? (lastFact.avgCheck-planAtCutoff.avgCheck)/planAtCutoff.avgCheck*100 : null;
    const revFactCumRow6 = factRows.reduce((s,r)=>s+(r.revenue||0),0);
    const netFactCumRow6 = factRows.reduce((s,r)=>s+(r.netProfit||0),0);
    const ordersFactCumRow6 = factRows.reduce((s,r)=>s+(r.orders||0),0);
    const avgOrdersFactRow6 = factRows.length ? ordersFactCumRow6/factRows.length : null;
    const currentMarginRow6 = revFactCumRow6 ? netFactCumRow6/revFactCumRow6 : null;
    const neededRevenueRow6 = (be.requiredMonthlyProfit!=null && currentMarginRow6>0) ? be.requiredMonthlyProfit/currentMarginRow6 : null;
    const neededCheck = (neededRevenueRow6!=null && avgOrdersFactRow6) ? neededRevenueRow6/avgOrdersFactRow6 : null;
    cards.push({ label:'СРЕДНИЙ ЧЕК, ₽', value: fmtNum(lastFact.avgCheck),
      info:'Средний чек, при текущем количестве заказов, нужный для выхода на окупаемость в плановый срок.', rows:[
      { label:'к плану', value: pct!=null?fmtPct(pct,1):'—', tone: pct!=null?(pct>=0?'good':'bad'):'neutral' },
      { label:'нужно для окуп.', value: neededCheck!=null?fmtNum(neededCheck)+' ₽':'—', tone: (neededCheck!=null)?(lastFact.avgCheck>=neededCheck?'good':'bad'):'neutral' },
    ]});
  }

  // 7) Заказы, сред./мес.
  {
    const avgOrdersFact = factRows.reduce((s,r)=>s+(r.orders||0),0)/factRows.length;
    const matchedPlan = factRows.map(r=>planByDate[+r.date]).filter(Boolean);
    const avgOrdersPlan = matchedPlan.length ? matchedPlan.reduce((s,r)=>s+(r.orders||0),0)/matchedPlan.length : null;
    const pct = avgOrdersPlan ? (avgOrdersFact-avgOrdersPlan)/avgOrdersPlan*100 : null;
    const revFactCumRow7 = factRows.reduce((s,r)=>s+(r.revenue||0),0);
    const netFactCumRow7 = factRows.reduce((s,r)=>s+(r.netProfit||0),0);
    const ordersFactCumRow7 = factRows.reduce((s,r)=>s+(r.orders||0),0);
    const currentMarginRow7 = revFactCumRow7 ? netFactCumRow7/revFactCumRow7 : null;
    const avgCheckRow7 = ordersFactCumRow7 ? revFactCumRow7/ordersFactCumRow7 : null;
    const neededRevenueRow7 = (be.requiredMonthlyProfit!=null && currentMarginRow7>0) ? be.requiredMonthlyProfit/currentMarginRow7 : null;
    const neededOrders = (neededRevenueRow7!=null && avgCheckRow7) ? neededRevenueRow7/avgCheckRow7 : null;
    cards.push({ label:'ЗАКАЗЫ, СРЕД./МЕС.', value: fmtNum(Math.round(avgOrdersFact)),
      info:'Среднее число заказов в месяц, при текущем среднем чеке, нужное для выхода на окупаемость в плановый срок.', rows:[
      { label:'к плану', value: pct!=null?fmtPct(pct,1):'—', tone: pct!=null?(pct>=0?'good':'bad'):'neutral' },
      { label:'нужно для окуп.', value: neededOrders!=null?fmtNum(Math.round(neededOrders))+' шт':'—', tone: (neededOrders!=null)?(avgOrdersFact>=neededOrders?'good':'bad'):'neutral' },
    ]});
  }

  grid.innerHTML = cards.map(c => `
    <div class="kpi">
      ${c.info?`<button class="kpi-info" type="button" data-tip="${c.info.replace(/"/g,'&quot;')}">i</button>`:''}
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="indicators">
        ${c.rows.map(r => `<div class="ind-row"><span class="ind-label">${r.label}</span><span class="ind-value ${r.tone}">${r.value}</span></div>`).join('')}
      </div>
    </div>`).join('');
}

// ==================== insights (tagged by topic) ====================
function computeAllInsights(planRows, factRows, lastFact, planByDate, be){
  if (!lastFact) return [];
  const cards = [];
  const planCumRows = planRows.filter(r=>r.date<=lastFact.date);
  const revFactCum = factRows.reduce((s,r)=>s+(r.revenue||0),0);
  const revPlanCum = planCumRows.reduce((s,r)=>s+(r.revenue||0),0);

  function streakInfo(key){
    const gaps = factRows.map(r => { const p = planByDate[+r.date]; return p && p[key] ? (r[key]-p[key])/p[key]*100 : null; }).filter(v=>v!=null);
    if (!gaps.length) return null;
    const lastGap = gaps[gaps.length-1];
    let streak = 0;
    for (let i=gaps.length-1;i>=0;i--){ if ((gaps[i]<0)===(lastGap<0)) streak++; else break; }
    return { lastGap, streak, below: lastGap<0 };
  }

  // Заказы
  const ordersS = streakInfo('orders');
  if (ordersS){
    cards.push({ topic:'Заказы', tone: ordersS.below?'bad':'good', icon: ordersS.below?'down':'up',
      html: `Заказы <b>${ordersS.below?'ниже':'выше'} плана ${ordersS.streak} мес. подряд</b> (сейчас ${fmtPct(ordersS.lastGap,1)}).${ordersS.below?' Рекомендация: разобрать воронку привлечения/удержания клиентов — маркетинг, конверсию, отток.':' Хорошая динамика — стоит зафиксировать, что сработало, и масштабировать.'}` });
  }

  // Средний чек
  const checkS = streakInfo('avgCheck');
  if (checkS){
    cards.push({ topic:'Средний чек', tone: checkS.below?'bad':'good', icon: checkS.below?'down':'up',
      html: `Средний чек <b>${checkS.below?'ниже':'выше'} плана ${checkS.streak} мес. подряд</b> (сейчас ${fmtPct(checkS.lastGap,1)}).${checkS.below?' Рекомендация: проверить ценообразование, скидки и долю мелких заказов.':' Апсейл/ценообразование работают лучше плана.'}` });
  }

  // Выручка
  const revS = streakInfo('revenue');
  if (revS){
    const driverTopic = ordersS && checkS ? (Math.abs(ordersS.lastGap) >= Math.abs(checkS.lastGap) ? 'заказы' : 'средний чек') : null;
    cards.push({ topic:'Выручка', tone: revS.below?'bad':'good', icon: revS.below?'down':'up',
      html: `Выручка <b>${revS.below?'ниже':'выше'} плана ${revS.streak} мес. подряд</b> (сейчас ${fmtPct(revS.lastGap,1)}).${driverTopic?` Основной драйвер — <b>${driverTopic}</b>, подробнее на соответствующей вкладке.`:''}` });
  }

  // Расходы: unplanned + ratio-worst
  const catDefs = [
    ['partnerPrice','Партнерский прайс'], ['royalty','Роялти'],
    ['salary','ЗП с ФОТ'], ['salaryTax','Зарплатные налоги'], ['loanInterest','Проценты по займу'],
  ];
  let unplanned = null, worstRatio = null;
  catDefs.forEach(([key,label]) => {
    const factSum = factRows.reduce((s,r)=>s+(r[key]||0),0);
    const planSum = planCumRows.reduce((s,r)=>s+(r[key]||0),0);
    if (!factSum && !planSum) return;
    const factRatio = revFactCum ? factSum/revFactCum*100 : 0;
    const planRatio = revPlanCum ? planSum/revPlanCum*100 : 0;
    const isUnplanned = planSum < revPlanCum*0.002 && factSum > revFactCum*0.01;
    if (isUnplanned && (!unplanned || factSum > unplanned.factSum)) unplanned = { label, factSum, factRatio };
    const ratioDelta = factRatio - planRatio;
    if (!isUnplanned && (!worstRatio || ratioDelta > worstRatio.ratioDelta)) worstRatio = { label, ratioDelta, factRatio, planRatio, factSum, planSum };
  });
  if (unplanned){
    cards.push({ topic:'Расходы', tone:'bad', icon:'alert',
      html: `Статья <b>«${unplanned.label}»</b> не заложена в план на этот период, но по факту уже составляет <b>${unplanned.factRatio.toFixed(1)}% выручки</b> (${fmtRub(unplanned.factSum,true)}) — внеплановые расходы. Рекомендация: уточнить условия начисления у контрагента и внести статью в план.` });
  }
  if (worstRatio && worstRatio.ratioDelta > 1.5){
    cards.push({ topic:'Расходы', tone:'warn', icon:'alert',
      html: `Статья <b>«${worstRatio.label}»</b> растёт как доля выручки: план ${worstRatio.planRatio.toFixed(1)}% → факт ${worstRatio.factRatio.toFixed(1)}% (+${worstRatio.ratioDelta.toFixed(1)} п.п.). Рекомендация: пересмотреть условия/тариф по «${worstRatio.label}».` });
  }
  const expS = streakInfo('expenses');
  if (expS){
    cards.push({ topic:'Расходы', tone: expS.below?'good':'bad', icon: expS.below?'down':'up',
      html: `Расходы нарастающим итогом ${expS.below?'ниже':'выше'} плана (сейчас отклонение ${fmtPct(expS.lastGap,1)} за последний месяц).` });
  }

  // Прибыль: rentability + BDR-adjusted + breakeven/recommendation
  const netFactCum = factRows.reduce((s,r)=>s+(r.netProfit||0),0);
  const netPlanCum = planCumRows.reduce((s,r)=>s+(r.netProfit||0),0);
  if (revFactCum && revPlanCum){
    const rFact = netFactCum/revFactCum*100, rPlan = netPlanCum/revPlanCum*100, d = rFact-rPlan;
    cards.push({ topic:'Прибыль', tone: d>=0?'good':'bad', icon: d>=0?'up':'down',
      html: `Рентабельность нарастающим итогом: факт <b>${rFact.toFixed(1)}%</b> против плана ${rPlan.toFixed(1)}% (${fmtPP(d)}).${d<0?' Это напрямую отдаляет точку окупаемости.':''}` });
  }
  if (lastFact.finResultCum != null && lastFact.cumProfit != null){
    const gap = lastFact.cumProfit - lastFact.finResultCum;
    if (Math.abs(gap) > Math.abs(lastFact.cumProfit)*0.03 + 5000){
      cards.push({ topic:'Прибыль', tone:'warn', icon:'alert',
        html: `С учётом равномерного списания стоимости привлечения клиента (БДР), реальный накопленный финрезультат — <b>${fmtRub(lastFact.finResultCum,true)}</b>, это на ${fmtRub(Math.abs(gap),true)} ${gap>0?'ниже':'выше'} операционной чистой прибыли. Более консервативная оценка — эта.` });
    }
  }
  if (be.investment!=null && be.planBE){
    if (be.delta != null){
      let rec = '';
      if (be.requiredMonthlyProfit!=null && be.actualRecentMonthlyProfit!=null){
        if (be.requiredMonthlyProfit > be.actualRecentMonthlyProfit){
          const gap = be.requiredMonthlyProfit - be.actualRecentMonthlyProfit;
          rec = ` Чтобы уложиться в плановый срок (${fmtMon(be.planBE.date)}), нужно нарастить среднюю чистую прибыль минимум на <b>${fmtRub(gap,true)}/мес</b> (сейчас ${fmtRub(be.actualRecentMonthlyProfit,true)}/мес, нужно ${fmtRub(be.requiredMonthlyProfit,true)}/мес).`;
        } else {
          rec = ` Текущий темп прибыли (${fmtRub(be.actualRecentMonthlyProfit,true)}/мес) уже выше необходимого — задержка объясняется стартовым отставанием, а не текущей динамикой.`;
        }
      }
      cards.push({ topic:'Прибыль', tone: be.delta<=0?'good':'warn', icon: be.delta<=0?'up':'alert',
        html: (be.delta===0 ? `Проект окупается <b>точно по плану</b> — ${fmtMon(be.planBE.date)}.` : `Точка окупаемости ${be.delta>0?'сдвигается позже плана':'наступает раньше плана'} на <b>${Math.abs(be.delta)} мес.</b>`) + rec });
    } else if (be.projFailed){
      cards.push({ topic:'Прибыль', tone:'bad', icon:'alert', html:`При текущем темпе чистая прибыль не растёт — окупаемость (план: ${fmtMon(be.planBE.date)}) под риском срыва. Приоритет — остановить снижение выручки и/или сократить статью с наибольшим отклонением (см. вкладку «Расходы»).` });
    }
  }

  return cards;
}

// ==================== charts ====================
function alignToPlan(planRows, factRows, key){
  const idx = {}; planRows.forEach((r,i)=>idx[+r.date]=i);
  const arr = new Array(planRows.length).fill(null);
  factRows.forEach(r => { const i = idx[+r.date]; if (i!=null) arr[i] = r[key]; });
  return arr;
}
// Holt's damped-trend exponential smoothing — standard method for short business series
// without seasonality. Uses the FULL actual history (recency-weighted via alpha/beta,
// so old months naturally matter less without arbitrarily discarding them), and damps
// ==================== fact-only trend + seasonality ====================
// Fits the underlying trend using only the "steady state" (non-Q4) actual months, then measures
// an explicit Q4 multiplier by comparing the actual Oct/Nov/Dec months to what that trend would
// have predicted for them. Fact data starts in October 2025, so the very first observed months
// ARE Q4 — if the business shows a seasonal uplift there, this multiplier captures it and carries
// it into the projected Q4 2026. Fitting trend+season jointly on such a short series (as an
// all-points OLS+residual decomposition would) lets the launch quarter distort the trend line
// itself, understating the seasonal effect — separating them like this avoids that.
function fitTrendAndSeasonality(factRows, key){
  const sorted = factRows.slice().sort((a,b)=>a.date-b.date);
  const n = sorted.length;
  if (n === 0) return null;
  const Q4 = new Set([9,10,11]); // Oct, Nov, Dec (JS 0-based months)
  const nonQ4 = sorted.filter(r => !Q4.has(r.date.getMonth()) && r[key]!=null);
  const q4Rows = sorted.filter(r => Q4.has(r.date.getMonth()) && r[key]!=null);

  let slope = 0, intercept = 0, baseDate = sorted[0].date;
  if (nonQ4.length >= 2){
    const xs = nonQ4.map(r => monthsBetween(baseDate, r.date));
    const ys = nonQ4.map(r => r[key]);
    const xMean = xs.reduce((s,v)=>s+v,0)/xs.length;
    const yMean = ys.reduce((s,v)=>s+v,0)/ys.length;
    let num=0, den=0;
    for (let i=0;i<xs.length;i++){ num += (xs[i]-xMean)*(ys[i]-yMean); den += (xs[i]-xMean)*(xs[i]-xMean); }
    slope = den ? num/den : 0;
    intercept = yMean - slope*xMean;
  } else if (nonQ4.length === 1){
    intercept = nonQ4[0][key]; slope = 0; baseDate = nonQ4[0].date;
  } else {
    const vals = sorted.map(r=>r[key]).filter(v=>v!=null);
    intercept = vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0; slope = 0;
  }

  let q4Multiplier = 1;
  if (q4Rows.length){
    const ratios = q4Rows.map(r => {
      const x = monthsBetween(baseDate, r.date);
      const trendVal = intercept + slope*x;
      return trendVal>0 ? r[key]/trendVal : null;
    }).filter(v=>v!=null);
    if (ratios.length) q4Multiplier = ratios.reduce((s,v)=>s+v,0)/ratios.length;
  }

  const lastDate = sorted[n-1].date;
  const lastX = monthsBetween(baseDate, lastDate);
  return { slope, intercept, baseDate, lastFitted: intercept + slope*lastX, lastDate, q4Multiplier };
}

function forecastFromTrend(model, targetDate, applySeasonal, phi){
  applySeasonal = applySeasonal==null ? true : applySeasonal;
  phi = phi==null ? 0.85 : phi;
  if (!model) return null;
  const h = monthsBetween(model.lastDate, targetDate);
  let trendVal;
  if (h <= 0){
    trendVal = model.lastFitted;
  } else {
    let phiSum = 0;
    for (let s=1; s<=h; s++) phiSum += Math.pow(phi, s);
    trendVal = model.lastFitted + phiSum*model.slope;
  }
  if (!applySeasonal) return trendVal;
  const cm = targetDate.getMonth();
  const isQ4 = (cm===9 || cm===10 || cm===11);
  return isQ4 ? trendVal*model.q4Multiplier : trendVal;
}

// Only ORDERS gets the Q4 seasonal multiplier applied — genuine seasonal demand (more parcels in
// the holiday season) is plausible there. Average check is a pricing decision, not something that
// swings with the calendar, and the only Q4 data point we have (Oct-Dec 2025) is completely
// confounded with the business's launch quarter — e.g. any launch-period discounting would get
// misread as "Q4 causes a lower cheque" and wrongly repeated every year. So avgCheck (and margin,
// used for profit below) use trend only, no seasonal multiplier.
function buildProjection(planRows, factRows, key){
  const factAligned = alignToPlan(planRows, factRows, key);
  let lastIdx = -1;
  for (let i=0;i<factAligned.length;i++) if (factAligned[i]!=null) lastIdx = i;
  const dashed = new Array(planRows.length).fill(null);
  if (lastIdx < 0) return { solid: factAligned, dashed };

  const model = fitTrendAndSeasonality(factRows, key);
  const applySeasonal = (key === 'orders');
  const nonNegative = !(key === 'netProfit' || key === 'profitBeforeTax' || key === 'cumProfit');
  dashed[lastIdx] = factAligned[lastIdx];
  for (let i=lastIdx+1; i<planRows.length; i++){
    let v = forecastFromTrend(model, planRows[i].date, applySeasonal);
    if (v!=null && nonNegative && v<0) v = 0;
    dashed[i] = v;
  }
  return { solid: factAligned, dashed };
}

function buildConsistentProjections(planRows, factRows){
  const ordersProj = buildProjection(planRows, factRows, 'orders');
  const checkProj  = buildProjection(planRows, factRows, 'avgCheck');

  let lastIdx = -1;
  for (let i=0;i<ordersProj.solid.length;i++) if (ordersProj.solid[i]!=null) lastIdx = i;

  const revenueSolid = alignToPlan(planRows, factRows, 'revenue');
  const revenueDashed = new Array(planRows.length).fill(null);
  if (lastIdx>=0) revenueDashed[lastIdx] = revenueSolid[lastIdx];
  for (let i=lastIdx+1; i<planRows.length; i++){
    const o = ordersProj.dashed[i], c = checkProj.dashed[i];
    revenueDashed[i] = (o!=null && c!=null) ? o*c : null;
  }

  // Profit: rather than fitting its own independent Q4 multiplier (equally confounded with the
  // launch quarter, and prone to producing an unexplainable "profit spike" with no real driver
  // behind it), we fit a trend-only margin (net profit ÷ revenue) and apply it to the
  // orders-driven revenue forecast above. That way the ONE genuine seasonal signal we have
  // (order volume) is what flows through the whole model, instead of five independent guesses.
  const marginSeries = factRows.filter(r => r.revenue).map(r => ({ date: r.date, margin: r.netProfit/r.revenue }));
  const marginModel = fitTrendAndSeasonality(marginSeries, 'margin');
  const profitSolid = alignToPlan(planRows, factRows, 'netProfit');
  const profitDashed = new Array(planRows.length).fill(null);
  if (lastIdx>=0) profitDashed[lastIdx] = profitSolid[lastIdx];
  for (let i=lastIdx+1; i<planRows.length; i++){
    const marginForecast = forecastFromTrend(marginModel, planRows[i].date, false);
    profitDashed[i] = (revenueDashed[i]!=null && marginForecast!=null) ? revenueDashed[i]*marginForecast : null;
  }

  const expensesSolid = alignToPlan(planRows, factRows, 'expenses');
  const expensesDashed = new Array(planRows.length).fill(null);
  if (lastIdx>=0) expensesDashed[lastIdx] = expensesSolid[lastIdx];
  for (let i=lastIdx+1; i<planRows.length; i++){
    expensesDashed[i] = (revenueDashed[i]!=null && profitDashed[i]!=null) ? revenueDashed[i]-profitDashed[i] : null;
  }

  return {
    orders: ordersProj,
    avgCheck: checkProj,
    revenue: { solid: revenueSolid, dashed: revenueDashed },
    profit: { solid: profitSolid, dashed: profitDashed },
    expenses: { solid: expensesSolid, dashed: expensesDashed },
  };
}

function baseLine(label, color, extra){
  return Object.assign({ label, borderColor:color, backgroundColor:color, borderWidth:2.5,
    pointRadius:2.5, pointHoverRadius:5, pointHitRadius:10, tension:.3, spanGaps:false }, extra||{});
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function pickScale(maxAbs){
  if (maxAbs >= 1000000) return { divisor:1000000, unit:'млн ₽', digits:2 };
  if (maxAbs >= 1000) return { divisor:1000, unit:'тыс ₽', digits:1 };
  return { divisor:1, unit:'₽', digits:0 };
}

function chartBaseOptions(moneyAxis, tickColor, divisor){
  divisor = divisor || 1;
  return {
    responsive:true, maintainAspectRatio:false,
    events:['click','touchstart'],
    interaction:{mode:'nearest', intersect:true},
    scales:{
      x:{ grid:{color:'rgba(255,255,255,0.08)'}, ticks:{color:tickColor||'#888888', font:{family:'Geologica', weight:'400', size:13}, maxRotation:0, autoSkip:true, maxTicksLimit:9} },
      y:{ grid:{color:'rgba(255,255,255,0.08)'}, ticks:{color:tickColor||'#888888', font:{family:'Geologica', weight:'400', size:13},
            callback: moneyAxis ? (v)=>{ const d = divisor>=1000000?1:0; return (v/divisor).toLocaleString('ru-RU',{minimumFractionDigits:d, maximumFractionDigits:d}); } : (v)=>fmtNum(v) } }
    },
    plugins:{ legend:{display:false}, tooltip:{
      mode:'nearest', intersect:true,
      backgroundColor:'#1e1e1e', borderColor:'#333333', borderWidth:1,

      callbacks:{ label:(ctx)=> ctx.raw==null?'': ` ${ctx.dataset.label}: ${moneyAxis?fmtRub(ctx.raw,true):fmtNum(ctx.raw)}` }
    }}
  };
}

  const labels = planRows.map(r=>fmtMon(r.date));

  const allVals = [].concat(planVals, solid, dashed).filter(v => v!=null && !isNaN(v));

    const pad = (maxV - minV) * 0.15 || Math.abs(maxV) * 0.1 || 10;
    options.scales.y.min = minV >= 0 ? Math.max(0, minV - pad) : minV - pad;
    options.scales.y.max = maxV + pad;

  if (charts.metric) charts.metric.destroy();
  charts.metric = new Chart(document.getElementById('chart-metric'), {
    type:'line',
    data:{ labels, datasets:[
      baseLine('План', planColor, {data:planVals}),

      baseLine('Прогноз', accent, {data:dashed, borderDash:[6,5], pointRadius:0, borderWidth:2}),
    ]},
    options
  });
}

const RU_MONTHS_NODOT = ['янв','февр','март','апр','май','июнь','июль','авг','сент','окт','нояб','дек'];
function fmtMonNoDot(d){ return RU_MONTHS_NODOT[d.getMonth()] + String(d.getFullYear()).slice(2); }

const payoffMarkerPlugin = {
  id: 'payoffMarkers',
  afterDraw(chart){
    const opts = chart.options.plugins && chart.options.plugins.payoffMarkers;
    if (!opts || !opts.markers || !opts.markers.length) return;
    const { ctx, chartArea, scales } = chart;
    const xScale = scales.x, yScale = scales.y;
    const midX = (chartArea.left + chartArea.right) / 2;
    const spanX = chartArea.right - chartArea.left;

    opts.markers.forEach((mk, i) => {
      if (mk.index == null || mk.index < 0 || mk.index >= chart.data.labels.length) return;
      const x = xScale.getPixelForValue(mk.index);
      const y = opts.investmentValue!=null ? yScale.getPixelForValue(opts.investmentValue) : yScale.getPixelForValue(mk.value);

      ctx.save();
      // bright dot exactly at the intersection with the investment line
      ctx.fillStyle = mk.color;
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI*2);
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#121927';
      ctx.stroke();

      // both labels sit at the same height above the intersection point; the plan marker's
      // label is nudged left so it doesn't sit right on top of its own line
      const labelY = Math.max(chartArea.top + 10, y - 16);
      const labelX = x + (mk.role === 'plan' ? -14 : 0);
      const align = mk.role === 'plan' ? 'right' : (labelX > midX + spanX*0.15 ? 'right' : (labelX < midX - spanX*0.15 ? 'left' : 'center'));
      ctx.fillStyle = mk.color;
      ctx.font = "400 11px 'Geologica'";
      ctx.textAlign = align;
      ctx.textBaseline = 'bottom';
      ctx.fillText(mk.label, labelX, labelY);
      ctx.restore();
    });
  }
};

function buildCumProfitProjection(planRows, factRows, lastFact, projections){
  const factAligned = alignToPlan(planRows, factRows, 'cumProfit');
  let lastIdx = -1;
  for (let i=0;i<factAligned.length;i++) if (factAligned[i]!=null) lastIdx = i;
  const dashed = new Array(planRows.length).fill(null);
  if (lastIdx < 0 || !lastFact) return { solid: factAligned, dashed };

  // Integrate the SAME orders×check→revenue→margin→profit projection shown on the "Прибыль" tab —
  // this is what keeps the payoff chart, the "Прибыль" chart, and the "Срок окупаемости" KPI
  // from disagreeing with each other (they used to be computed independently).
  const profitDashed = (projections && projections.profit.dashed) || null;
  dashed[lastIdx] = factAligned[lastIdx];
  let cum = lastFact.cumProfit;
  for (let i=lastIdx+1; i<planRows.length; i++){
    const projectedNet = profitDashed ? (profitDashed[i]||0) : 0;
    cum += projectedNet;
    dashed[i] = cum;
  }
  return { solid: factAligned, dashed };
}

function renderPayoffChart(planRows, factRows, be, projections){
  const labels = planRows.map(r=>fmtMon(r.date));
  const lastFact = factRows.length ? factRows.slice().sort((a,b)=>a.date-b.date).slice(-1)[0] : null;
  const { solid, dashed } = buildCumProfitProjection(planRows, factRows, lastFact, projections);
  const invLine = be && be.investment!=null ? planRows.map(()=>be.investment) : null;
  const datasets = [
    baseLine('План','#a3e635',{data:planRows.map(r=>r.cumProfit)}),
    baseLine('Факт','#f97316',{data:solid}),
    baseLine('Прогноз','#f97316',{data:dashed, borderDash:[6,5], pointRadius:0, borderWidth:2}),
  ];
  if (invLine) datasets.push({ label:'Сумма вложений', data:invLine, borderColor:'#facc15', borderWidth:2.5, borderDash:[6,4], pointRadius:0, tension:0, fill:false });

  const allVals = [].concat(planRows.map(r=>r.cumProfit), solid, dashed, invLine||[]).filter(v=>v!=null && !isNaN(v));
  const scale = pickScale(allVals.length ? Math.max(...allVals.map(Math.abs)) : 0);
  document.getElementById('payoff-chart-title').textContent = `Окупаемость, ${scale.unit}`;

  const markers = [];
  if (be && be.planBE){
    const idx = planRows.findIndex(r => +r.date === +be.planBE.date);
    if (idx >= 0) markers.push({ index: idx, color:'#a3e635', label:fmtMonNoDot(be.planBE.date), role:'plan' });
  }
  if (be && be.factBE){
    const idx = planRows.findIndex(r => r.date.getFullYear()===be.factBE.date.getFullYear() && r.date.getMonth()===be.factBE.date.getMonth());
    if (idx >= 0) markers.push({ index: idx, color:'#f97316', label:fmtMonNoDot(be.factBE.date) });
  }

  if (charts.payoff) charts.payoff.destroy();
  const options = chartBaseOptions(true, '#ffffff', scale.divisor);
  options.plugins.payoffMarkers = { markers, investmentValue: be ? be.investment : null };
  charts.payoff = new Chart(document.getElementById('chart-payoff'), {
    type:'line', data:{ labels, datasets }, options, plugins:[payoffMarkerPlugin]
  });
}

  const tbody = document.getElementById('detail-tbody');

  const CAT_DEFS = [
    ['partnerPrice','Партнерский прайс'], ['royalty','Роялти'], ['salary','ЗП с ФОТ'],
    ['salaryTax','Зарплатные налоги'], ['loanInterest','Проценты по займу'],
    ['vatOut','НДС исходящий'], ['vatIn','НДС вход'],
  ];

  if (metric === 'expenses'){
    title.textContent = 'Расходы по статьям затрат';
    const cutoff = lastFact ? lastFact.date : null;
    const planCum = cutoff ? planRows.filter(r=>r.date<=cutoff) : [];
    period.textContent = (planRows.length && cutoff) ? `(${fmtMon(planRows[0].date)} – ${fmtMon(cutoff)})` : '';
    expandBtn.style.display = '';
    cachedExpenseModalData = { factRows: factRows.slice().sort((a,b)=>a.date-b.date), planRows: planRows.slice().sort((a,b)=>a.date-b.date), catDefs: CAT_DEFS };

    thead.innerHTML = `<tr><th>Статья</th><th>План, ₽</th><th>Факт, ₽</th><th>Отклонение, ₽</th><th>% к плану</th></tr>`;
    tbody.innerHTML = CAT_DEFS.map(([key,label]) => {
      const planSum = planCum.reduce((s,r)=>s+(r[key]||0),0);
      const factSum = factRows.reduce((s,r)=>s+(r[key]||0),0);
      const delta = factSum - planSum;
      const pct = planSum ? factSum/planSum*100 : (factSum?Infinity:null);
      return `<tr>
        <td>${label}</td><td>${fmtRubPlain(planSum)}</td><td>${fmtRubPlain(factSum)}</td>
        <td style="color:#ffffff">${delta>=0?'+':''}${fmtRubPlain(delta)}${ICONS[delta>0?'arrowDown':'arrowUp'].replace('<svg ',`<svg class="delta-arrow" style="color:${delta>0?'#ff4d4d':'#a3e635'}" `)}</td>
        <td>${pct==null?'—':(pct===Infinity?'внеплан.':pct.toFixed(0)+'%')}</td>
      </tr>`;
    }).join('');
    return;
  }

  if (metric === 'bdr'){
    title.textContent = 'БДР по месяцам';
    period.textContent = '';
    expandBtn.style.display = 'none';
    thead.innerHTML = `<tr><th>Дата</th><th>Затраты на клиента (БДР), ₽</th><th>Чистая прибыль, ₽</th><th>Фин. рез. БДР, ₽</th></tr>`;
    const sortedFact = factRows.slice().sort((a,b)=>a.date-b.date);
    tbody.innerHTML = sortedFact.map(r => {
      const cacNet = (r.cacAmort!=null && r.cacVat!=null) ? (r.cacAmort - r.cacVat) : null;
      const isLastFact = lastFact && +r.date === +lastFact.date;
      return `<tr${isLastFact?' id="row-last-fact" class="row-current"':''}><td>${fmtMon(r.date)}</td><td>${cacNet!=null?fmtRubPlain(cacNet):'—'}</td><td>${r.netProfit!=null?fmtRubPlain(r.netProfit):'—'}</td><td>${r.finResultPeriod!=null?fmtRubPlain(r.finResultPeriod):'—'}</td></tr>`;
    }).join('');
    const lastFactRowBdr = document.getElementById('row-last-fact');
    if (lastFactRowBdr && typeof lastFactRowBdr.scrollIntoView === 'function') lastFactRowBdr.scrollIntoView({ block:'nearest' });
    return;
  }

  period.textContent = '';
  expandBtn.style.display = 'none';

  const unit = m.money ? '₽' : 'шт';
  title.textContent = m.label + ' по месяцам';
  thead.innerHTML = `<tr><th>Дата</th><th>План, ${unit}</th><th>Факт, ${unit}</th><th>Откл., ${unit}</th><th>Откл., %</th></tr>`;
  const factByDate = {}; factRows.forEach(r=>factByDate[+r.date]=r);
  tbody.innerHTML = planRows.map(pr => {
    const fr = factByDate[+pr.date];
    const planVal = pr[m.field];
    const factVal = fr ? fr[m.field] : null;
    let deltaAbsCell = '—', deltaPctCell = '—';
    if (factVal!=null && planVal!=null){
      const deltaAbs = factVal - planVal;
      const fmtDelta = (v) => m.money ? fmtRubPlain(v) : fmtNum(v);
      deltaAbsCell = `<span style="color:#ffffff">${deltaAbs>=0?'+':''}${fmtDelta(deltaAbs)}${ICONS[deltaAbs>=0?'arrowUp':'arrowDown'].replace('<svg ',`<svg class="delta-arrow" style="color:${deltaAbs>=0?'#a3e635':'#ff4d4d'}" `)}</span>`;
      if (planVal){
        const pct = deltaAbs/planVal*100;
        deltaPctCell = `<span class="${pct>=0?'delta-pos':'delta-neg'}">${fmtPct(pct,0)}</span>`;
      }
    }
    const fmtVal = (v) => v==null ? '—' : (m.money ? fmtRubPlain(v) : fmtNum(v));
    const isLastFact = lastFact && +pr.date === +lastFact.date;
    return `<tr${isLastFact?' id="row-last-fact" class="row-current"':''}><td>${fmtMon(pr.date)}</td><td>${fmtVal(planVal)}</td><td>${fmtVal(factVal)}</td><td>${deltaAbsCell}</td><td>${deltaPctCell}</td></tr>`;
  }).join('');

  const lastFactRow = document.getElementById('row-last-fact');
  if (lastFactRow && typeof lastFactRow.scrollIntoView === 'function') lastFactRow.scrollIntoView({ block:'nearest' });
}

// ==================== expense-by-month modal ====================
let expenseModalType = 'Факт';

function populateExpenseModalTable(type){
  if (!cachedExpenseModalData) return;
  const { factRows, planRows, catDefs } = cachedExpenseModalData;
  const rows = type === 'План' ? planRows : factRows;
  const thead = document.querySelector('#expense-modal-table thead');
  const tbody = document.querySelector('#expense-modal-table tbody');
  thead.innerHTML = `<tr><th>Месяц</th>${catDefs.map(([,label])=>`<th>${label}</th>`).join('')}<th>Итого</th></tr>`;
  const rowsHtml = rows.map(r => {
    const cells = catDefs.map(([key]) => fmtRubPlain(r[key]||0));
    const total = catDefs.reduce((s,[key])=>s+(r[key]||0),0);
    return `<tr><td>${fmtMon(r.date)}</td>${cells.map(c=>`<td>${c}</td>`).join('')}<td>${fmtRubPlain(total)}</td></tr>`;
  }).join('');
  const totalsRow = `<tr class="modal-total"><td>Итого</td>${catDefs.map(([key])=>`<td>${fmtRubPlain(rows.reduce((s,r)=>s+(r[key]||0),0))}</td>`).join('')}<td>${fmtRubPlain(rows.reduce((s,r)=>s+catDefs.reduce((s2,[key])=>s2+(r[key]||0),0),0))}</td></tr>`;
  tbody.innerHTML = rowsHtml + totalsRow;
}

function openExpenseModal(){
  if (!cachedExpenseModalData) return;
  expenseModalType = 'Факт';
  document.querySelectorAll('#modal-type-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.type==='Факт'));
  populateExpenseModalTable('Факт');
  document.getElementById('expense-modal').classList.add('open');
}
function closeExpenseModal(){ document.getElementById('expense-modal').classList.remove('open'); }

document.getElementById('expand-btn').addEventListener('click', openExpenseModal);
document.getElementById('modal-close').addEventListener('click', closeExpenseModal);
document.getElementById('expense-modal').addEventListener('click', (e) => { if (e.target.id==='expense-modal') closeExpenseModal(); });
document.getElementById('modal-type-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#modal-type-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  expenseModalType = btn.dataset.type;
  populateExpenseModalTable(expenseModalType);
});

// ==================== KPI info tooltip ====================
document.getElementById('kpi-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.kpi-info');
  const tip = document.getElementById('kpi-tooltip');
  if (!btn){ tip.style.display = 'none'; return; }
  e.stopPropagation();
  const alreadyOpenFor = tip.dataset.forBtn;
  if (alreadyOpenFor === btn.dataset.tip && tip.style.display === 'block'){
    tip.style.display = 'none';
    return;
  }
  tip.textContent = btn.dataset.tip;
  tip.dataset.forBtn = btn.dataset.tip;
  tip.style.display = 'block';
  const r = btn.getBoundingClientRect();
  const tipWidth = 230;
  let left = r.right - tipWidth;
  if (left < 8) left = 8;
  tip.style.left = left + 'px';
  tip.style.top = (r.bottom + 6) + 'px';
});
document.addEventListener('click', () => { document.getElementById('kpi-tooltip').style.display = 'none'; });

// ==================== toggle wiring ====================
document.getElementById('metric-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#metric-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentMetric = btn.dataset.m;
  renderInsightsPanel(currentMetric);
  renderMetricChart(currentMetric, cachedPlanRows, cachedFactRows, cachedProjections);
  renderDetailTable(currentMetric, cachedPlanRows, cachedFactRows, cachedLastFact, cachedPlanByDate);
});

// ==================== 16:9 stage scaling ====================
function fitStage(){
  const stage = document.getElementById('stage');
  const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

loadData();
setInterval(() => loadData(), 5*60*1000);
</script>
